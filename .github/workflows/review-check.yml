name: Review source check

on:
  push:
    paths:
      - 'SC*.md'
      - 'scripts/validate_review.py'
      - '.github/workflows/review-check.yml'
  pull_request:
    paths:
      - 'SC*.md'
      - 'scripts/validate_review.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate scene files
        run: python scripts/validate_review.py
